    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }
        h1 {
            margin: 20px 0;
            font-size: 1.8rem;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        ul {
            list-style-type: none;
            padding: 0;
            width: 90%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        li {
            margin: 10px;
            width: 40%;
            box-sizing: border-box;
        }
        a {
            display: block;
            padding: 8px 12px;
            border-radius: 8px;
            background-color: #4caf50;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.3s ease-in-out;
        }
        a:hover {
            background-color: #3e8e41;
            transform: translateY(-2px);
        }
        .button {
            padding: 10px 20px;
            background: linear-gradient(45deg, #ff5722, #ff9800);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            margin: 15px;
            transition: all 0.3s ease-in-out;
        }
        .button:hover {
            background: linear-gradient(45deg, #e64a19, #ff5722);
            transform: translateY(-2px);
        }
        footer {
            margin-top: auto;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }
        footer a {
            color: #80d0c7;
            text-decoration: none;
            font-weight: bold;
        }
        footer a:hover {
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            color: #000000;
            text-align: left;
            overflow-y: auto;
            max-height: 80vh;
        }
        .modal-content h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .modal-content ul {
            list-style: none;
            padding: 0;
        }
        .modal-content li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-content input[type="checkbox"] {
            transform: scale(1.2);
        }
        .modal-footer {
            text-align: center;
            margin-top: 20px;
        }
        .modal-footer .button {
            background-color: #4caf50;
            color: white;
        }
        .modal-footer .button:hover {
            background-color: #3e8e41;
        }
    </style>
</head>

    <script>

        function openSelected() {
            const checkboxes = document.querySelectorAll('.modal-content input[type="checkbox"]:checked');
            checkboxes.forEach(checkbox => {

            });
            closeModal();
        }
