<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه لودینگ</title>
    <style>
        /* استایل برای صفحه لودینگ */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: 'Arial', sans-serif;
        }

        .loader-container {
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }

        .loader-text span {
            font-weight: bold;
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <div class="loader-text">
            <span>Powered by AirdropBeFarsi</span>
        </div>
    </div>

    <script>
        // پس از ۵ ثانیه، به صفحه اصلی هدایت می‌شوید
        setTimeout(function() {
            window.location.href = 'dex.html';
        }, 5000);
    </script>
</body>
</html>
