<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABF App</title>
    <style>
        body {
            background-image: url('Picsart_25-01-01_23-03-18-152.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #00FF00;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
            transition: opacity 0.5s ease;
        }

        /* انیمیشن fade-out برای محو شدن صفحه */
        body.fade-out {
            opacity: 0;
        }

        h1 {
            font-size: 3rem;
            margin-top: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .button {
            padding: 12px 24px;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 180px; /* اندازه ثابت برای دکمه‌ها */
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* سایه برای جذابیت بیشتر */
        }

        .button:hover {
            transform: scale(1.05); /* بزرگتر شدن دکمه هنگام هاور */
            background: linear-gradient(45deg, #2575fc, #6a11cb); /* معکوس شدن گرادیان */
        }

        /* انیمیشن fadeIn برای ورود صفحه */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <h1>𝙰𝙱𝙵</h1>
    <p>Choose an option:</p>
    <div class="button-container">
        <button class="button" onclick="navigateTo('omp.html')">💸Exchange</button>
        <button class="button" onclick="navigateTo('tonkeeper.html')">💎TonKeeper</button>
        <button class="button" onclick="navigateTo('Aa.html')">🔎Airdrops</button>
        <button class="button" onclick="navigateTo('Bb.html')">🌟ChatGPT</button>
        <button class="button" onclick="navigateTo('Blum.html')">💥BlumClicker</button>
        <button class="button" onclick="navigateTo('Tradingview.Html')">♻️Trade</button>
    </div>

    <script>
        function navigateTo(page) {
            // اضافه کردن کلاس fade-out برای محو شدن صفحه قبل از تغییر
            document.body.classList.add('fade-out');
            // بعد از 500 میلی ثانیه صفحه را تغییر دهید
            setTimeout(() => {
                window.location.href = page;
            }, 500); // مدت زمان انیمیشن
        }

        // اضافه کردن انیمیشن fadeIn برای بارگذاری صفحه
        document.body.style.animation = "fadeIn 1s ease-in-out";
    </script>
</body>
</html>
