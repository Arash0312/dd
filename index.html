<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Page</title>
    <style>
        /* تنظیمات عمومی صفحه */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a; /* پس‌زمینه تیره */
            font-family: 'Courier New', Courier, monospace; /* فونت تایپ‌نویسی */
            color: #ecf0f1;
            text-align: center;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ecf0f1;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 20px;
            font-weight: bold;
            color: #ecf0f1;
            margin-bottom: 10px;
        }

        .dollar-sign {
            font-size: 60px;
            animation: bounce 1s infinite;
            margin-bottom: 20px;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .powered-by {
            font-size: 18px;
            color: #ecf0f1;
            opacity: 0;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid #ecf0f1;
            width: 0ch;
            animation: typing 2s steps(22) forwards, blink-caret 0.75s step-end infinite;
            animation-delay: 3s, 3s;
        }

        @keyframes typing {
            from { width: 0ch; }
            to { width: 22ch; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #ecf0f1; }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <div class="loader-text">
            <span>This is your last chance for dollar income</span>
        </div>
        <div class="dollar-sign">
            💵
        </div>
        <div class="powered-by">
            Powered by AirdropBeFarsi
        </div>
    </div>

    <script>
        // هدایت به صفحه اصلی پس از 5 ثانیه
        setTimeout(function() {
            window.location.href = 'dex.html';
        }, 5000);
    </script>
</body>
</html>
