<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Page</title>
    <style>
        /* Styles for the loading page */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a; /* Darker background */
            font-family: 'Arial', sans-serif;
            color: #ecf0f1;
            text-align: center;
        }

        .loader-container {
            position: relative;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ecf0f1;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 20px;
            font-weight: bold;
            color: #ecf0f1;
            margin-bottom: 10px;
        }

        .dollar-sign {
            font-size: 60px;
            animation: bounce 1s infinite;
            margin-bottom: 20px;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .powered-by {
            font-size: 14px;
            color: #ecf0f1;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <div class="loader-text">
            <span>This is your last chance for dollar income</span>
        </div>
        <div class="dollar-sign">
            💵
        </div>
        <div class="powered-by">
            <span>Powered by AirdropBeFarsi</span>
        </div>
    </div>

    <script>
        // After 5 seconds, redirect to the main page
        setTimeout(function() {
            window.location.href = 'dex.html';
        }, 5000);
    </script>
</body>
</html>
