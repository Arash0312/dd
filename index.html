<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABF App</title>
    <style>
        body {
            background-image: url('Picsart_25-01-01_23-03-18-152.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #00FF00;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
        }
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .button {
            padding: 12px 24px;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 180px; /* اندازه ثابت برای دکمه‌ها */
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* سایه برای جذابیت بیشتر */
        }
        .button:hover {
            transform: scale(1.05); /* بزرگتر شدن دکمه هنگام هاور */
            background: linear-gradient(45deg, #2575fc, #6a11cb); /* معکوس شدن گرادیان */
        }
    </style>
</head>
<body>
    <h1>𝙰𝙱𝙵</h1>
    <p>Choose an option:</p>
    <div class="button-container">
        <button class="button" onclick="window.location.href='omp.html'">💸Exchange</button>
        <button class="button" onclick="window.location.href='tonkeeper.html'">💎TonKeeper</button>
        <button class="button" onclick="window.location.href='Aa.html'">🔎Airdrops</button>
        <button class="button" onclick="window.location.href='Bb.html'">🌟ChatGPT</button>
        <button class="button" onclick="window.location.href='Blum.html'">💥BlumClicker</button>
        <button class="button" onclick="window.location.href='Tradingview.Html'">♻️TradingView</button>
    </div>
</body>
</html>
