<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Page</title>
    <style>
        /* Styles for the loading page */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50; /* Dark background */
            font-family: 'Arial', sans-serif;
            color: #ecf0f1;
            text-align: center;
        }

        .loader-container {
            position: relative;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            color: #ecf0f1;
        }

        .loader-text span {
            font-weight: bold;
            color: #3498db;
        }

        .dollar-sign {
            font-size: 50px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <div class="loader-text">
            <span>This is your last chance for dollar income</span>
        </div>
        <div class="dollar-sign">
            💵
        </div>
        <div class="loader-text">
            <span>Powered by AirdropBeFarsi</span>
        </div>
    </div>

    <script>
        // After 5 seconds, redirect to the main page
        setTimeout(function() {
            window.location.href = 'dex.html';
        }, 5000);
    </script>
</body>
</html>
