<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABF App</title>
    <!-- اضافه کردن فونت‌های فارسی و انگلیسی -->
    <link href="https://fonts.googleapis.com/css2?family=Vazir&family=Roboto&display=swap" rel="stylesheet">
    <style>
        /* کلیات استایل صفحه */
        body {
            background-image: url('Picsart_25-01-01_23-03-18-152.jpg'); /* تصویر پس زمینه */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            font-family: 'Roboto', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* انیمیشن برای متن */
        .animated-text {
            font-size: 2.5rem;
            animation: slideIn 3s ease-in-out forwards;
            white-space: nowrap;
            overflow: hidden;
            border-right: 4px solid white;
            display: inline-block;
            padding-right: 5px;
            margin-bottom: 20px;
        }

        /* انیمیشن برای ورود متن */
        @keyframes slideIn {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        /* انیمیشن برای دلار */
        .dollar {
            font-size: 5rem; /* اندازه دلار به اندازه کافی بزرگ باشد */
            margin-top: 20px;
            opacity: 0;
            animation: fadeIn 2s ease-in-out 3s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* انیمیشن برای "Powered by AirdropBeFarsi" */
        .powered-text {
            font-size: 1.2rem;
            margin-top: 30px;
            opacity: 0;
            animation: slideInLeft 3s ease-in-out 5s forwards;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* استایل برای صفحه اصلی (دکمه‌ها و سایر محتوا) */
        #main-content {
            display: none; /* صفحه اصلی مخفی می‌شود */
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .button {
            padding: 12px 24px;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 180px;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .button:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #2575fc, #6a11cb);
        }

        /* انیمیشن fadeIn برای صفحه */
        @keyframes fadeInPage {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- صفحه بارگذاری (با انیمیشن‌ها) -->
    <div id="loading-screen">
        <div class="animated-text">This is your only chance for Dollar income</div>
        <div class="dollar">$1</div>
        <div class="powered-text">Powered by AirdropBeFarsi</div>
    </div>

    <!-- صفحه اصلی -->
    <div id="main-content">
        <h1>𝙰𝙱𝙵</h1>
        <p>Choose an option:</p>
        <div class="button-container">
            <button class="button" onclick="navigateTo('omp.html')">💸Exchange</button>
            <button class="button" onclick="navigateTo('tonkeeper.html')">💎TonKeeper</button>
            <button class="button" onclick="navigateTo('Aa.html')">🔎Airdrops</button>
            <button class="button" onclick="navigateTo('Bb.html')">🌟ChatGPT</button>
            <button class="button" onclick="navigateTo('Blum.html')">💥BlumClicker</button>
            <button class="button" onclick="navigateTo('Tradingview.Html')">♻️Trade</button>
        </div>
    </div>

    <script>
        // بعد از ۵ ثانیه انیمیشن‌ها تمام می‌شوند و صفحه اصلی نمایش داده می‌شود
        setTimeout(() => {
            document.getElementById("loading-screen").style.display = "none";  // مخفی کردن صفحه بارگذاری
            document.getElementById("main-content").style.display = "block";   // نمایش صفحه اصلی
            document.body.style.animation = "fadeInPage 1s ease-in-out"; // انیمیشن برای ورود به صفحه اصلی
        }, 5000); // ۵ ثانیه

        // تابع برای هدایت به صفحات دیگر
        function navigateTo(page) {
            window.location.href = page;
        }
    </script>
</body>
</html>
