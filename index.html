<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniApps ABF</title>
  <style>
    /* تنظیمات کلی */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a1d, #4e4e50);
      color: #fff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: opacity 0.5s ease-in-out;
    }

    body.fade-out {
      opacity: 0;
    }

    .menu-container {
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .title {
      font-size: 3rem;
      color: #39ff14;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 10px #39ff14;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 2rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .menu-btn {
      background: linear-gradient(90deg, #6a11cb, #2575fc);
      border: none;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .menu-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
    }

    .menu-btn:active {
      transform: scale(0.95);
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="menu-container">
    <h1 class="title">ABF</h1>
    <p class="subtitle">Choose an option:</p>
    <div class="buttons">
      <button class="menu-btn" onclick="navigateTo('exchange.html')">💵 Exchange</button>
      <button class="menu-btn" onclick="navigateTo('tonkeeper.html')">💎 TonKeeper</button>
      <button class="menu-btn" onclick="navigateTo('airdrops.html')">🔍 Airdrops</button>
      <button class="menu-btn" onclick="navigateTo('chatgpt.html')">✨ ChatGPT</button>
      <button class="menu-btn" onclick="navigateTo('blumclicker.html')">💥 BlumClicker</button>
      <button class="menu-btn" onclick="navigateTo('trade.html')">♻️ Trade</button>
    </div>
  </div>

  <script>
    function navigateTo(page) {
      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = page;
      }, 500);
    }
  </script>
</body>
</html>
