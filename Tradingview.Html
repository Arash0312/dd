<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Charts</title>
    <style>
        body {
            background: linear-gradient(135deg, #00b894, #0984e3);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #fff;
            font-weight: 600;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }
        .button {
            padding: 14px 30px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 18px;
            margin: 15px;
            transition: all 0.3s ease-in-out;
            font-weight: 500;
        }
        .button:hover {
            transform: translateY(-4px);
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.3);
        }
        .button:active {
            transform: scale(0.98);
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
        }
        img {
            max-width: 80%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
        }
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }
        footer a {
            color: #00c6ff;
            text-decoration: none;
            font-weight: 600;
        }
        footer a:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Crypto Charts</h1>
    <div id="mainButtons">
        <button class="button" onclick="showSpot()">Spot</button>
        <button class="button" onclick="showFutures()">Futures</button>
        <button class="button" onclick="window.location.href='https://www.tradingview.com/'">Chart</button>
        <button class="button" onclick="goBack()">Go Back</button>
    </div>

    <!-- Spot Section -->
    <div id="spotSection" class="hidden">
    <button class="button" onclick="window.location.href='https://arash0312.github.io/Lmain/'">BTC</button>
    <button class="button" onclick="window.location.href='https://arash0217.github.io/Kk/'">ETH</button>
    <button class="button" onclick="window.location.href='https://arash0217.github.io/Law/'">NOT</button>
    <br>
    <button class="button" onclick="goBack()">Go Back</button>
</div>

    <!-- BTC Section -->
    <div id="btcSection" class="hidden">
        <h2>BTC Spot Chart</h2>
        <img src="Picsart_25-01-03_19-37-08-293.jpg" alt="BTC Spot Chart">
        <br>
        <button class="button" onclick="showSpot()">Go Back</button>
    </div>

    <!-- ETH Section -->
    <div id="ethSection" class="hidden">
        <h2>ETH Spot Chart</h2>
        <img src="Picsart_25-01-03_19-04-31-004.jpg" alt="ETH Spot Chart">
        <br>
        <button class="button" onclick="showSpot()">Go Back</button>
    </div>

<!-- Futures Section -->
<div id="futuresSection" class="hidden">
    <h2>Futures Prices</h2>
    <button class="button" onclick="window.location.href='http://t.me/HamsterkeyReadybot/Jaj'">Nothing Yet!</button>
    <br>
    <button class="button" onclick="goBack()">Go Back</button>
</div>


    <!-- Ton Section -->
    <div id="tonSection" class="hidden">
        <h2>Ton Futures Chart</h2>
        <img src="Picsart_25-01-04_17-43-27-756.jpg" alt="Ton Futures Chart">
        <br>
        <button class="button" onclick="showFutures()">Go Back</button>
    </div>

<!-- pepe Section -->
<div id="pepeSection" class="hidden">
    <h2>Pepe Futures Chart</h2>
    <a href="https://arash0312.github.io/mm/" target="_blank">
        Visit Pepe Chart
    </a>
    <br>
    <button class="button" onclick="showFutures()">Go Back</button>
</div>

    <footer>
        Powered By <a href="https://t.me/AirdropBeFarsi" target="_blank">AirdropBeFarsi</a>
    </footer>

    <script>
        function showSpot() {
            document.getElementById('mainButtons').classList.add('hidden');
            document.getElementById('spotSection').classList.remove('hidden');
        }

        function showFutures() {
            document.getElementById('mainButtons').classList.add('hidden');
            document.getElementById('futuresSection').classList.remove('hidden');
        }

        function showTon() {
            document.getElementById('futuresSection').classList.add('hidden');
            document.getElementById('tonSection').classList.remove('hidden');
        }

        function showPepe() {
            document.getElementById('futuresSection').classList.add('hidden');
            document.getElementById('pepeSection').classList.remove('hidden');
        }

        function showBTC() {
            document.getElementById('spotSection').classList.add('hidden');
            document.getElementById('btcSection').classList.remove('hidden');
        }

        function showETH() {
            document.getElementById('spotSection').classList.add('hidden');
            document.getElementById('ethSection').classList.remove('hidden');
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
