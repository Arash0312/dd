<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Charts</title>
    <style>
        body {
            background: linear-gradient(135deg, #00b894, #0984e3);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #fff;
            font-weight: 600;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }
        .button {
            padding: 14px 30px;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 18px;
            margin: 15px;
            transition: all 0.3s ease-in-out;
            font-weight: 500;
        }
        .button:hover {
            transform: translateY(-4px);
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.3);
        }
        .button:active {
            transform: scale(0.98);
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
        }
        .hidden {
            display: none;
        }
        img {
            max-width: 80%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
        }
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }
        footer a {
            color: #00c6ff;
            text-decoration: none;
            font-weight: 600;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Crypto Charts</h1>
    <div id="mainButtons">
        <!-- دکمه‌های انتخاب بخش -->
        <button class="button" onclick="showSection('spot')">Spot</button>
        <button class="button" onclick="showSection('futures')">Futures</button>
    </div>

    <!-- بخش Spot -->
    <div id="spotSection" class="hidden">
        <h2>Spot Charts</h2>
        <button class="button" onclick="showImage('eth')">ETH Chart Spot</button>
        <button class="button" onclick="showImage('btc')">BTC Chart Spot</button>
        <button class="button" onclick="goBack()">Go Back</button>
    </div>

    <!-- بخش Futures -->
    <div id="futuresSection" class="hidden">
        <h2>Futures Charts</h2>
        <button class="button" onclick="showImage('Ton')">Ton Chart Futures</button>
        <button class="button" onclick="goBack()">Go Back</button>
    </div>

    <!-- تصاویر Spot -->
    <div id="ethImage" class="hidden">
        <img src="Picsart_25-01-03_19-04-31-004.jpg" alt="ETH Chart Spot">
        <br>
        <button class="button" onclick="hideImage()">Go Back</button>
    </div>
    <div id="btcImage" class="hidden">
        <img src="Picsart_25-01-03_19-37-08-293.jpg" alt="BTC Chart Spot">
        <br>
        <button class="button" onclick="hideImage()">Go Back</button>
    </div>

    <!-- تصاویر Futures -->
    <div id="TonImage" class="hidden">
        <img src="Picsart_25-01-04_17-43-27-756.jpg" alt="Ton Chart Futures">
        <br>
        <button class="button" onclick="hideImage()">Go Back</button>
    </div>

    <footer>
        Powered By <a href="https://t.me/AirdropBeFarsi" target="_blank">AirdropBeFarsi</a>
    </footer>

    <script>
        function showSection(section) {
            // مخفی کردن دکمه‌های اصلی
            document.getElementById('mainButtons').classList.add('hidden');
            // نمایش بخش انتخاب شده
            if (section === 'spot') {
                document.getElementById('spotSection').classList.remove('hidden');
            } else if (section === 'futures') {
                document.getElementById('futuresSection').classList.remove('hidden');
            }
        }

        function showImage(type) {
            // مخفی کردن بخش‌ها
            document.getElementById('spotSection').classList.add('hidden');
            document.getElementById('futuresSection').classList.add('hidden');
            // نمایش تصویر مرتبط
            if (type === 'eth') {
                document.getElementById('ethImage').classList.remove('hidden');
            } else if (type === 'btc') {
                document.getElementById('btcImage').classList.remove('hidden');
            } else if (type === 'Ton') {
                document.getElementById('TonImage').classList.remove('hidden');
            }
        }

        function hideImage() {
            // مخفی کردن تصاویر
            document.getElementById('ethImage').classList.add('hidden');
            document.getElementById('btcImage').classList.add('hidden');
            document.getElementById('TonImage').classList.add('hidden');
            // بازگشت به بخش اصلی
            document.getElementById('mainButtons').classList.remove('hidden');
        }

        function goBack() {
            // مخفی کردن تمام بخش‌ها
            document.getElementById('spotSection').classList.add('hidden');
            document.getElementById('futuresSection').classList.add('hidden');
            // نمایش دکمه‌های اصلی
            document.getElementById('mainButtons').classList.remove('hidden');
        }
    </script>
</body>
</html>
