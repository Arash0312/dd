<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به تونی‌کیپر</title>
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
        }
        .button {
            padding: 12px 25px;
            background: linear-gradient(45deg, #00ff00, #32cd32);
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.3s ease-in-out;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
        }
        .button:active {
            transform: scale(0.98);
        }
        footer {
            position: absolute;
            bottom: 10px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }
        footer a {
            color: #00ff00;
            text-decoration: none;
            font-weight: bold;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Ton Page</h1>
    <button class="button" onclick="window.location.href='https://wallet.tonkeeper.com'">Login To Tonkeeper</button>
    <button class="button" onclick="window.location.href='https://dedust.io/swap'">Login To Dedust</button>
    <button class="button" onclick="history.back()">Go back</button>
    <footer>
        Powered By <a href="https://t.me/AirdropBeFarsi" target="_blank">AirdropBeFarsi</a>
    </footer>
</body>
</html>
